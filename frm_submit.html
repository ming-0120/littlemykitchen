<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
     <title>주문 완료 - 주문 정보</title>
    <link rel="icon" href="./img/logo_1.png" type="image/x-icon">
    <link rel="stylesheet" href="./style/home_style.css">
    <link rel="stylesheet" href="./style/frm_submit.css">
</head> 
<body>
    <div id="header"></div>
    <div class="container">
        <header>
            <h1>주문이 완료되었습니다.</h1>
            <p>주문하신 정보는 아래에서 확인하실 수 있습니다.</p>
        </header> 
        <section class="card" role="region" aria-labelledby="order-title">
            <div class="order-info" aria-live="polite">
                <h2 id="order-title" style="margin:0 0 6px 0;">주문자 정보</h2> 
                <div class="row">
                    <div class="label">이름</div>
                    <div id="name" class="value">-</div>
                </div> 
                <div class="row">
                    <div class="label">전화번호</div>
                    <div id="phone" class="value">-</div>
                </div>

                <div class="row">
                    <div class="label">이메일</div>
                    <div id="email" class="value">-</div>
                </div> 
                <div class="row">
                    <div class="label">우편번호</div>
                    <div id="postcode" class="value">-</div>
                </div> 
                <div class="row">
                    <div class="label">주소</div>
                    <div id="address" class="value">-</div>
                </div> 
                <div class="row">
                    <div class="label">상세주소</div>
                    <div id="address_detail" class="value">-</div>
                </div> 
                <div>
                    <div class="label" style="display:inline-block; margin-bottom:6px;">요청사항</div>
                    <div id="notes" class="value" style="margin-top:4px;">-</div>
                </div> 
                <div class="actions">
                    <button class="btn-primary" id="printBtn" title="홈으로">홈으로</button>
                </div> 
                <div class="receipt small">
                    주문번호: <strong id="order_no">#AUTO-20251023-0001</strong><br>
                    주문일시: <span id="order_date">2025-10-23 13:00</span>
                </div>
            </div>
        </section>
    </div>
</body>
<div id="footer"></div>
</html>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="./script/main.js"></script>
<script src="./script/frm_submit.js"></script>
