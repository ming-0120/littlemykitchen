<link rel="stylesheet" href="./style/chatbot_style.css">
<div class="modal_chat" id="chatModal">
  <div class="chat_body">
    <button class="close_btn" id="closeChat">&times;</button>
    <h2>🍳 AI 요리 비서</h2>

    <div class="chat_window" id="chatWindow">
      <div class="bot_msg">안녕하세요! 남은 재료로 만들 요리를 도와드릴게요 😄</div>
    </div>

    <div class="chat_input_area">
      <input type="text" id="userInput" placeholder="예: 두부랑 고추장으로 뭐 만들 수 있을까?">
      <button id="sendBtn" >전송</button>
    </div>
  </div>
</div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script> 
    <script src="https://kit.fontawesome.com/51772bd9bd.js" crossorigin="anonymous"></script>
<script src="./script/chatbot.js"></script>
